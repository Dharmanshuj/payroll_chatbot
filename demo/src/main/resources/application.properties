spring.application.name=demo

# Render (and most PaaS hosts) inject $PORT at runtime; default to 8080 for local dev.
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:company}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# ── HikariCP connection pool ─────────────────────────────────────────────────
# Neon's free-tier compute auto-suspends after ~5 min of no activity. Pooled
# connections need to cycle faster than that so Hikari retires/refreshes them
# itself, instead of Neon silently killing them out from under the pool (which
# otherwise surfaces as broken-pipe/connection-reset errors on the next query
# after a suspend/resume cycle).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.max-lifetime=270000
# Actively pings idle pooled connections every 2 min - under Neon's ~5 min
# autosuspend window - so Neon sees real traffic and the pool stays warm.
spring.datasource.hikari.keepalive-time=120000

# ── Embedded server idle timeout ─────────────────────────────────────────────
# How long Tomcat keeps an idle/keep-alive HTTP connection open before closing
# it (also covers the MCP streamable-http transport's connections). Generous
# enough to tolerate a slow first request after Render/Neon wake from idle,
# without holding sockets open indefinitely.
server.tomcat.connection-timeout=60000
server.tomcat.keep-alive-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# MCP Server Configuration
spring.ai.mcp.server.name=hr-payroll-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

spring.jpa.open-in-view=false

